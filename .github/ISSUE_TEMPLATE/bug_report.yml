name: Bug report
description: Something in VulnScope behaves wrongly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If this is a **security vulnerability in VulnScope
        itself**, please close this and use
        [private reporting](https://github.com/mintyextremum/vulnscope/security/advisories/new)
        instead — an issue is public the moment you press submit.

        For a **missed detection or a false positive**, use the
        "Detection problem" template instead: it asks for the code sample that
        turns the report into a regression test.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project at ...
        2. Enable ...
        3. Scan
        4. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: VulnScope version
      description: Shown in the app, or the installer filename.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 24H2"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: >
        Screenshots, the scanned project's language and rough size, and whether
        any external scanners were installed.
