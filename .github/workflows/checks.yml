name: checks

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main]

# The workflow only reads the code. Anything wider would hand a compromised step
# push access — the same thing VS-CI-004 flags in other people's pipelines.
permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a commit, not a tag: a tag can be
      # moved under us, which is exactly what VS-CI-002 reports.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Contrast audit (WCAG + colour-vision)
        run: npm run audit:contrast
      - name: Localization completeness
        run: npm run audit:i18n
      # `tsc --noEmit` says the types hold; it says nothing about whether the
      # bundle builds. Rollup's tree-shaking, env inlining and asset handling
      # only happen here.
      - name: Production build
        run: npm run build

  # A scanner that reports vulnerable dependencies in other people's projects
  # should know about its own. Both tools read the lockfiles, so this needs
  # neither a build nor the Tauri system libraries and stays a fast job.
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: npm audit
        run: npm audit --audit-level=high
      - uses: taiki-e/install-action@678b06b887cdbf44fa0601e5915f865e17c2241d # v2.44.60
        with:
          tool: cargo-audit
      # Fails on advisories only. The unmaintained/unsound warnings today are
      # GTK3 bindings Tauri pulls in for its Linux backend — not code that ships
      # in the Windows build, and not ours to fix.
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

  backend:
    # Windows is what this ships on, and the code knows it: PATHEXT resolution
    # for .cmd shims, and parser fixtures captured from real tools on Windows
    # whose path normalisation only makes sense there. Testing on Linux would
    # mean testing something other than what users run.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          workspaces: src-tauri
      - name: Tests
        working-directory: src-tauri
        run: cargo test --lib
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --lib -- -D warnings
