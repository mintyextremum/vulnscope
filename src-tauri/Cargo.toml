[package]
name = "vulnscope"
version = "1.0.0"
description = "Desktop security scanner: static-analysis rules, taint tracking, secret detection and CVE lookup, running fully on your machine."
authors = ["MintyExtremum"]
license = "Apache-2.0"
repository = "https://github.com/mintyextremum/vulnscope"
homepage = "https://github.com/mintyextremum/vulnscope"
readme = "../README.md"
keywords = ["security", "sast", "static-analysis", "vulnerability", "scanner"]
categories = ["development-tools", "command-line-utilities"]
edition = "2021"
rust-version = "1.77"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vulnscope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4.28"
regex = "1.13.0"
rayon = "1.12.0"
anyhow = "1.0.103"
toml = "1.1.3"
sha2 = "0.11.0"
dirs = "6.0.0"
once_cell = "1.21.4"
chrono = "0.4.45"
walkdir = "2.5.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
tauri-plugin-dialog = "2.7.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "charset", "http2"] }

